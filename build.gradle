plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.91'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'libz-neoforge'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java.withSourcesJar()

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // src/main/resources/META-INF/accesstransformer.cfg is picked up automatically if present

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        // Smoke test: the client must reach the title screen and exit by itself.
        // The mod reads -Dlibz.port.exitOnTitle=true.
        clientSmoke {
            client()
            systemProperty 'libz.port.exitOnTitle', 'true'
        }
        // Smoke test: dedicated server starts, ticks and stops by itself.
        // The mod reads -Dlibz.port.serverSmoke=true. Needs eula=true in run/eula.txt.
        serverSmoke {
            server()
            programArgument '--nogui'
            systemProperty 'libz.port.serverSmoke', 'true'
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    maven { name = 'Shedaniel (Cloth Config, REI, Architectury)'; url = 'https://maven.shedaniel.me/' }
    maven { name = 'TerraformersMC (EMI)'; url = 'https://maven.terraformersmc.com/' }
    mavenCentral()
}

dependencies {
    // Cloth Config (AutoConfig): required, same API as on Fabric.
    implementation "me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}"

    // Jankson: shipped inside the mod jar, as in the original (Fabric `include`).
    implementation "blue.endless:jankson:${jankson_version}"
    jarJar("blue.endless:jankson") { version { strictly "[${jankson_version},)"; prefer jankson_version } }
    additionalRuntimeClasspath "blue.endless:jankson:${jankson_version}"

    // Optional integrations, compile-only (absent at runtime is fine).
    // EMI: full jar, LibzEmiPlugin uses EMI's internal accessor dev.emi.emi.mixin.accessor.HandledScreenAccessor.
    compileOnly "dev.emi:emi-neoforge:${emi_version}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-api-neoforge:${rei_version}"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs += ['-Xmaxerrs', '100000', '-Xmaxwarns', '0']
}

jar {
    from('LICENSE') { rename { "${it}_libz" } }
}

// LevelZ (../../levelz/port) consumes this from mavenLocal: ./gradlew publishToMavenLocal
publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = 'net.libz'
            artifactId = 'libz-neoforge'
            version = mod_version
            from components.java
        }
    }
}
